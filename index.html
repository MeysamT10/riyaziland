<body>
<div id="root"></div>
<div id="toast"></div>
<script>
/* === ERROR UI === */
function showError(msg, stack){
  const box = document.createElement('div');
  box.id = 'errBox';
  box.innerHTML = '<div class="modal"><h2>⚠️ خطا</h2><p>'+esc(msg)+'</p>'+
    (stack?'<pre>'+esc(stack)+'</pre>':'')+
    '<button onclick="resetAll()">🔄 پاک کردن داده‌ها و تلاش مجدد</button></div>';
  document.body.appendChild(box);
}
async function resetAll(){
  if(!confirm('همه داده‌ها (دانش‌آموزان، نمرات، تکالیف، آزمون‌ها) پاک می‌شود. مطمئنی؟')) return;
  try{ (await dbPromise)?.close(); }catch(e){}
  try{ indexedDB.deleteDatabase('riaziland'); }catch(e){}
  try{ localStorage.clear(); }catch(e){}
  location.reload();
}
window.addEventListener('error', e => {
  console.error('ERR:', e.error || e.message);
  if (!document.getElementById('root').innerHTML.trim()) {
    showError(e.error?.message || e.message, e.error?.stack);
  }
});
window.addEventListener('unhandledrejection', e => {
  console.error('UNH:', e.reason);
  if (!document.getElementById('root').innerHTML.trim()) {

/* === DB === */
let dbPromise = null;
function openDB(){
  if(dbPromise) return dbPromise;
  dbPromise = new Promise((res, rej) => {
    const tryOpen = (ver) => {
      let r;
      try { r = indexedDB.open('riaziland', ver); }
      catch(e){ return rej(e); }
      r.onupgradeneeded = e => {
        const db = e.target.result;
        const schema = {
          users:['username','role'], grades:['studentId','chapterId'],
          assignments:['grade','chapterId'], submissions:['assignmentId','studentId'],
          quizzes:['grade','chapterId'], attempts:['quizId','studentId'],
          resources:['grade','chapterId'], gameScores:['studentId','gameType'],
          sessions:[], activities:['userId','type']
        };
        for(const n in schema){
          if(!db.objectStoreNames.contains(n)){
            const s = db.createObjectStore(n,{keyPath:'id',autoIncrement:true});
            schema[n].forEach(idx => {
              try{ s.createIndex(idx,idx,{unique:idx==='username'}); }catch(e){}
            });
          }
        }
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => {
        const err = r.error;
        if(err?.name === 'VersionError'){
          const del = indexedDB.deleteDatabase('riaziland');
          del.onsuccess = () => { dbPromise = null; tryOpen((err.newVersion||100)+1); };
          del.onerror = () => rej(err);
        } else rej(err);
      };
      r.onblocked = () => rej(new Error('تب دیگری دیتابیس را باز کرده. همه تب‌ها را ببند.'));
    };
    tryOpen(100);
  });
  return dbPromise;
}
async function tx(store, mode, fn){
  const db = await openDB();
  return new Promise((res, rej) => {
    const t = db.transaction(store, mode);
    const s = t.objectStore(store);
    let req;
    try{ req = fn(s); }catch(e){ return rej(e); }
    t.oncomplete = () => res(req?.result);
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error);
  });
}
const DB = {
  get:(s,i)=>tx(s,'readonly',r=>r.get(i)),
  all:s=>tx(s,'readonly',r=>r.getAll()),
  add:(s,d)=>tx(s,'readwrite',r=>r.add(d)),
  put:(s,d)=>tx(s,'readwrite',r=>r.put(d)),
  del:(s,i)=>tx(s,'readwrite',r=>r.delete(i)),
  byIdx:(s,i,v)=>tx(s,'readonly',r=>r.index(i).getAll(v)),
  clear:s=>tx(s,'readwrite',r=>r.clear())
};

async function hash(pwd, salt){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pwd+'::'+salt));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}

    d.username=(d.username||'').trim().toLowerCase();

      fullName:d.fullName,grade:+d.grade,avatar:'🎓',createdAt:now()});

    return usr;

/* === XP / LEVELS === */
const TIERS = [{n:'تازه‌کار',i:'🌱'},{n:'کاوشگر',i:'🔍'},{n:'ماجراجو',i:'⚔️'},
  {n:'ماهر',i:'🎯'},{n:'استاد',i:'👑'},{n:'افسانه',i:'🌟'}];
function lvlInfo(xp){
  let lv = 1;
  while(50*(lv+1)*lv <= xp && lv < 50) lv++;
  const start = 50*lv*(lv-1), next = 50*(lv+1)*lv;
  const ti = Math.min(5, Math.floor((lv-1)/3));
  return {lv, name:TIERS[ti].n, icon:TIERS[ti].i, xp, start, next,
    progress: Math.min(100, ((xp-start)/(next-start))*100)};
}
async function logAct(uid, type, xp, meta={}){
  return DB.add('activities',{userId:uid,type,xp:xp||0,meta,createdAt:now()});
}
async function getUserActs(uid){ return DB.byIdx('activities','userId',uid); }
async function getUserXP(uid){ return (await getUserActs(uid)).reduce((s,a)=>s+(a.xp||0),0); }
async function getStreak(uid){
  const acts = await getUserActs(uid);
  const days = new Set(acts.filter(a=>a.type==='login').map(a=>new Date(a.createdAt).toDateString()));
  const t = new Date(); let st = 0;
  for(let i=0;i<365;i++){
    const d = new Date(t); d.setDate(d.getDate()-i);
    if(days.has(d.toDateString())) st++;
    else if(i===0) continue; else break;
  }
  return st;
}
async function awardXP(uid, type, amount, meta={}){
  const before = lvlInfo(await getUserXP(uid));
  await logAct(uid, type, amount, meta);
  const after = lvlInfo(await getUserXP(uid));
  if(after.lv > before.lv){
    toast(`🎉 سطح ${fmt(after.lv)}: ${after.icon} ${after.name}!`,'s');
    confetti();
  }
}

async function getMissions(uid){
  const acts = await getUserActs(uid);
  const tS = todayStart(), wS = weekStart();
  return MISSIONS.map(m => {
    const start = m.ty==='d' ? tS : wS;
    const cnt = acts.filter(a=>a.type===m.at && a.createdAt>=start).length;
    return {...m, progress: Math.min(cnt,m.tg), done: cnt>=m.tg};
  });
}
async function checkMissions(uid){
  const ms = await getMissions(uid), acts = await getUserActs(uid);
  for(const m of ms){
    if(!m.done) continue;
    const start = m.ty==='d' ? todayStart() : weekStart();
    if(acts.some(a=>a.type==='mission_complete'&&a.meta?.missionId===m.id&&a.createdAt>=start)) continue;
    await logAct(uid,'mission_complete',m.xp,{missionId:m.id,title:m.t});
    toast(`🎯 ${m.t} (+${fmt(m.xp)} XP)`,'s');
  }
}

        </div>
        <div class="xbw">
          <div class="xbl"><span>تا سطح ${fmt(lv.lv+1)}</span>
            <span>${fmt(xp-lv.start)} / ${fmt(lv.next-lv.start)}</span></div>
          <div class="xb"><div class="xbf" style="width:${lv.progress}%"></div></div>
        </div>
        <div style="display:flex;gap:14px;margin-top:12px;flex-wrap:wrap;font-size:.8rem">
          <div>🏆 <b>${fmt(rank)}</b> رتبه</div>
          <div>🎖️ <b>${fmt(earned.length)}</b> نشان</div>
          <div>📊 <b>${fmt(avg)}</b> میانگین</div>
          <div>🎯 <b>${fmt(attempts.length)}</b> آزمون</div>
        </div>
      </div>
    </div></div>

    <div class="card">
      <div class="ct">🎯 امروز چه مأموریتی داری؟ <span class="pill in">${fmt(doneM)}/${fmt(missions.length)}</span></div>
      <div class="gr g2">
        ${missions.map(m=>`<div class="mc ${m.done?'done':''}">
          <div class="mh"><div class="mi2">${m.i}</div>
            <div class="minf"><b>${m.t}</b><small>${m.d} • ${m.ty==='d'?'روزانه':'هفتگی'}</small></div>

          <div style="font-size:.68rem;color:var(--mu);margin-top:3px;text-align:left">

        <div class="ct">🎖️ نشان‌ها <a onclick="go('badges')" style="margin-right:auto;font-size:.78rem">همه ›</a></div>

async function delStu(id){
  const u = await DB.get('users', id);
  if(!u) return;
  if(!confirm(`حذف «${u.fullName}»؟`)) return;
  for(const st of ['grades','submissions','attempts','gameScores','activities']){
    const idx = st==='activities' ? 'userId' : 'studentId';
    const arr = await DB.byIdx(st, idx, id);
    for(const x of arr) await DB.del(st, x.id);

async function startQuiz(id){

  renderQuizQ();

function renderQuizQ(){
  const q = ST.quiz;
  if(!q) return go('myQuizzes');
  if(ST.qIdx >= q.questions.length) return finishQuiz();
  const qq = q.questions[ST.qIdx];
  const prog = (ST.qIdx / q.questions.length) * 100;
  $('#root').innerHTML = `<main class="mn" style="max-width:700px;margin:20px auto">
    <div class="qs">
      <div style="display:flex;justify-content:space-between;margin-bottom:12px;
        font-size:.8rem;color:var(--mu)">
        <span>${esc(q.title)}</span>
        <span>سوال ${fmt(ST.qIdx+1)} از ${fmt(q.questions.length)}</span>
      </div>
      <div class="qp"><div class="qpf" style="width:${prog}%"></div></div>
      <div class="qtx">${esc(qq.text)}</div>
      <div class="qo">
        ${qq.options.map((o,i)=>`<button class="qopt" onclick="ansQ(${i})">
          <span class="lt">${['الف','ب','ج','د'][i]}</span><span>${esc(o)}</span></button>`).join('')}
      </div>
    </div>
  </main>`;
}
function ansQ(i){
  const q = ST.quiz, qq = q.questions[ST.qIdx];
  const opts = $$('.qopt');
  if(opts[0]?.classList.contains('locked')) return;
  opts.forEach(o=>o.classList.add('locked'));
  if(i === qq.correct){
    opts[i].classList.add('correct');
    ST.qAns.push({qi:ST.qIdx,a:i,ok:true});
    toast('درست! 🎉','s');
  } else {
    opts[i].classList.add('wrong');
    opts[qq.correct].classList.add('correct');
    ST.qAns.push({qi:ST.qIdx,a:i,ok:false});
    toast('اشتباه','e');
  }
  setTimeout(()=>{ ST.qIdx++; renderQuizQ(); },1100);
}
async function finishQuiz(){
  const q = ST.quiz;
  const corr = ST.qAns.filter(a=>a.ok).length;
  const score = Math.round((corr/q.questions.length)*20*100)/100;
  await DB.add('attempts',{quizId:q.id,studentId:ST.user.id,answers:ST.qAns,
    score,maxScore:20,finishedAt:now()});
  await awardXP(ST.user.id,'quiz_submit',15);
  if(score>=15) await awardXP(ST.user.id,'quiz_bonus',Math.round(score));
  await checkMissions(ST.user.id);
  await checkBadges(ST.user.id);
  const pc = (corr/q.questions.length)*100;

    <div class="qs" style="text-align:center">
      <div style="font-size:3.5rem;margin-bottom:10px">${pc===100?'🏆':pc>=60?'🎉':'💪'}</div>

        ${statCard('📊',score,'از ۲۰','c1')}

      </div>
      <div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap">
        <button class="btn bp" onclick="startQuiz(${q.id})">🔄 دوباره</button>
        <button class="btn bs" onclick="ST.quiz=null;go('myQuizzes')">بازگشت</button>

  };
};
function launchGame(id){
  clearInterval(ST.game?.timer);
  ST.game = {id,score:0,time:60,streak:0,correct:0,wrong:0,current:null,timer:null};
  $('#root').innerHTML = `<main class="mn" style="max-width:720px;margin:20px auto">
    <div class="gar"><button class="btn bsm" style="position:absolute;top:12px;left:12px;z-index:3;background:rgba(255,255,255,.2);color:#fff" onclick="quitGame()">✖ خروج</button>
      <div class="ghud" style="margin-top:22px">
        <div class="hi"><div class="hl">امتیاز</div><div class="hv" id="g-score">۰</div></div>
        <div class="hi"><div class="hl">زمان</div><div class="hv" id="g-time">۶۰</div></div>
        <div class="hi"><div class="hl">استریک</div><div class="hv" id="g-streak">۰🔥</div></div>
      </div>
      <div class="geq" id="g-eq">...</div>
      <div class="gopts" id="g-opts"></div>
    </div>
  </main>`;
  nextRound();
  ST.game.timer = setInterval(()=>{
    ST.game.time--;
    const el = $('#g-time'); if(el) el.textContent = fmt(ST.game.time);
    if(ST.game.time <= 0) endGame();
  },1000);
}
function nextRound(){
  const g = ST.game; if(!g) return;
  let q, ans;
  switch(g.id){
    case 'calc': {
      const op = ['+','−','×'][randInt(0,2)];
      const a = op==='×' ? randInt(2,12) : randInt(10,99);
      const b = op==='×' ? randInt(2,12) : randInt(10,99);
      ans = op==='+'?a+b:op==='−'?a-b:a*b;
      q = `${a} ${op} ${b} = ?`; break;
    }
    case 'eq': {
      const a = randInt(2,9), x = randInt(-5,10), b = randInt(-20,20);
      ans = x; const bs = b>=0?`+ ${b}`:`− ${Math.abs(b)}`;
      q = `${a}x ${bs} = ${a*x+b}`; break;
    }
    case 'int': {
      const a = randInt(-15,15)||3, b = randInt(-15,15)||4;
      const op = ['+','−','×'][randInt(0,2)];
      ans = op==='+'?a+b:op==='−'?a-b:a*b;
      const sh = n => n<0?`(−${-n})`:`${n}`;
      q = `${sh(a)} ${op} ${sh(b)} = ?`; break;
    }
    default: {
      const t = randInt(0,2);
      if(t===0){ const a=randInt(1,20), d=randInt(2,9); ans=a+4*d; q=[0,1,2,3].map(i=>a+i*d).join('، ')+'، ؟'; }
      else if(t===1){ const a=randInt(1,4), r=randInt(2,3); ans=a*r**4; q=[0,1,2,3].map(i=>a*r**i).join('، ')+'، ؟'; }
      else { const k=randInt(1,9); ans=(k+4)**2; q=[0,1,2,3].map(i=>(k+i)**2).join('، ')+'، ؟'; }
    }
  }
  g.current = ans; g.lock = false;
  const set = new Set([ans]);
  while(set.size<4) set.add(ans+randInt(-10,10));
  const opts = [...set].sort(()=>Math.random()-.5);
  const sg = n => fmt(n<0?'−'+(-n):n);
  $('#g-eq').innerHTML = `<span dir="ltr">${fmt(q)}</span>`;
  $('#g-opts').innerHTML = opts.map(o=>`<button class="gopt" data-v="${o}" onclick="ansG(${o})"><span dir="ltr">${sg(o)}</span></button>`).join('');
}
function ansG(v){
  const g = ST.game; if(!g || g.lock || g.done) return; g.lock = true;
  const ok = v === g.current;
  $$('.gopt').forEach(b=>{ b.disabled = true;
    if(+b.dataset.v===g.current) b.classList.add('correct'); else if(+b.dataset.v===v) b.classList.add('wrong'); });
  if(ok){ g.correct++; g.streak++; g.score += 10 + (g.streak>=3?5:0); } else { g.wrong++; g.streak = 0; }
  $('#g-score').textContent = fmt(g.score); $('#g-streak').textContent = fmt(g.streak)+'🔥';
  setTimeout(()=>{ if(ST.game===g && !g.done) nextRound(); }, 450);
}
function quitGame(){ clearInterval(ST.game?.timer); ST.game = null; go('games'); }
async function endGame(){
  const g = ST.game; if(!g || g.done) return;
  g.done = true; clearInterval(g.timer);
  const u = ST.user, xp = Math.min(40, Math.round(g.score/4));
  await DB.add('gameScores',{studentId:u.id,gameType:g.id,score:g.score,correct:g.correct,wrong:g.wrong,playedAt:now()});
  await awardXP(u.id,'game_complete',xp);
  await checkMissions(u.id); await checkBadges(u.id);
  const gm = GAMES.find(x=>x.id===g.id);
  $('#root').innerHTML = `<main class="mn" style="max-width:720px;margin:20px auto"><div class="qs" style="text-align:center">
    <div style="font-size:3rem">${gm.i}</div><h2 style="margin:6px 0">${gm.t}</h2>
    <div class="gr g3" style="margin:16px 0">${statCard('🏆',g.score,'امتیاز','c1')}${statCard('✅',g.correct,'درست','c4')}${statCard('❌',g.wrong,'غلط','c2')}</div>
    <p style="color:var(--mu);margin-bottom:14px">+${fmt(xp)} XP</p>
    <div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap">
      <button class="btn bp" onclick="launchGame('${g.id}')">🔄 دوباره</button>
      <button class="btn bs" onclick="ST.game=null;go('games')">بازگشت</button></div></div></main>`;
  if(g.score>=50) confetti();
}

/* === Leaderboard / Badges / My grades / Reports === */
VIEWS.leaderboard = async u => {
  if(u.role!=='student') return {title:'لیگ',body:'<div class="empty">فقط برای دانش‌آموزان</div>'};
  const stu = (await DB.all('users')).filter(x=>x.role==='student'&&x.grade===u.grade);
  const list = (await Promise.all(stu.map(async x=>({...x,xp:await getUserXP(x.id)})))).sort((a,b)=>b.xp-a.xp);
  const pst = (r,k) => r ? `<div class="pst p${k}"><div class="pav">${esc(r.avatar||'🎓')}</div><div class="pnm">${esc(r.fullName)}</div><div class="psc">${fmt(r.xp)} XP</div><div class="pb">${fmt(k)}</div></div>` : '';
  return {title:'لیگ پایه '+fmt(u.grade), body:`<div class="card"><div class="ct">🏆 برترین‌ها</div>
    ${list.length?`<div class="pod">${pst(list[1],2)}${pst(list[0],1)}${pst(list[2],3)}</div>`:'<div class="empty"><div class="ei">📭</div><p>هنوز کسی نیست</p></div>'}
    ${list.map((r,i)=>{ const lg=leagueFor(r.xp);
      return `<div class="lrow ${r.id===u.id?'me':''}"><div class="lr ${i<3?'t'+(i+1):''}">${fmt(i+1)}</div>
      <div class="lnm">${esc(r.avatar||'🎓')} ${esc(r.fullName)}<div class="llg">${lg.i} ${lg.n} • سطح ${fmt(lvlInfo(r.xp).lv)}</div></div>
      <div class="lxp">${fmt(r.xp)} XP</div></div>`; }).join('')}</div>`};
};
VIEWS.badges = async u => {
  const bs = await evalBadges(u.id);
  return {title:'افتخارات', body:`<div class="card"><div class="ct">🎖️ نشان‌ها <span class="pill in">${fmt(bs.filter(b=>b.earned).length)}/${fmt(bs.length)}</span></div>
    <div class="gr g4">${bs.map(b=>`<div class="bcard ${b.earned?'earned':'locked'}"><span class="bi">${b.i}</span><b>${b.t}</b><small>${b.d}</small></div>`).join('')}</div></div>`};
};
VIEWS.myGrades = async u => {
  const [grades, attempts, quizzes] = await Promise.all([DB.byIdx('grades','studentId',u.id), DB.byIdx('attempts','studentId',u.id), DB.all('quizzes')]);
  const avg = grades.length ? (grades.reduce((a,g)=>a+ +g.score,0)/grades.length).toFixed(1) : '—';
  return {title:'کارنامه', body:`<div class="gr g3" style="margin-bottom:14px">${statCard('📊',avg,'میانگین نمرات','c1')}${statCard('📋',grades.length,'نمره ثبت‌شده','c2')}${statCard('🎯',attempts.length,'آزمون آنلاین','c4')}</div>
    <div class="card"><div class="ct">📊 نمرات</div>${grades.length?`<div class="tw"><table class="tbl"><thead><tr><th>عنوان</th><th>فصل</th><th>نمره</th><th>تاریخ</th></tr></thead><tbody>
      ${grades.slice().reverse().map(g=>`<tr><td>${esc(g.title)}</td><td>${esc(chS(g.chapterId))}</td><td>${gradePill(g.score)}</td><td>${fdate(g.createdAt)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><div class="ei">📭</div><p>نمره‌ای نیست</p></div>'}</div>
    <div class="card"><div class="ct">🎯 آزمون‌ها</div>${attempts.length?`<div class="tw"><table class="tbl"><thead><tr><th>آزمون</th><th>نمره</th><th>تاریخ</th></tr></thead><tbody>
      ${attempts.slice().reverse().map(a=>`<tr><td>${esc(quizzes.find(q=>q.id===a.quizId)?.title||'(حذف‌شده)')}</td><td>${gradePill(a.score)}</td><td>${fdate(a.finishedAt)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><div class="ei">📭</div><p>آزمونی نداده‌ای</p></div>'}</div>`};
};
VIEWS.reports = async u => {
  if(u.role!=='teacher') return {title:'گزارش‌ها',body:'<div class="empty">دسترسی ندارید</div>'};
  const [users, grades, attempts] = await Promise.all([DB.all('users'), DB.all('grades'), DB.all('attempts')]);
  const rows = await Promise.all(users.filter(x=>x.role==='student').map(async s=>{
    const g = grades.filter(x=>x.studentId===s.id);
    return {s, avg:g.length?g.reduce((a,x)=>a+ +x.score,0)/g.length:null, q:attempts.filter(a=>a.studentId===s.id).length, xp:await getUserXP(s.id)};
  }));
  rows.sort((a,b)=>(b.avg??-1)-(a.avg??-1));
  const chs = [7,8,9].flatMap(g=>CURR[g].ch.map(([id])=>id)).map(id=>{ const g=grades.filter(x=>x.chapterId===id); return g.length?{id,avg:g.reduce((a,x)=>a+ +x.score,0)/g.length}:null; }).filter(Boolean);
  return {title:'گزارش‌ها', body:`<div class="card"><div class="ct">👥 عملکرد دانش‌آموزان</div>${rows.length?`<div class="tw"><table class="tbl"><thead><tr><th>نام</th><th>پایه</th><th>میانگین</th><th>آزمون</th><th>XP</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td><b>${esc(r.s.fullName)}</b></td><td>${fmt(r.s.grade)}</td><td>${r.avg==null?'—':gradePill(r.avg.toFixed(1))}</td><td>${fmt(r.q)}</td><td>${fmt(r.xp)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><div class="ei">📭</div><p>دانش‌آموزی نیست</p></div>'}</div>
    <div class="card"><div class="ct">📚 میانگین هر فصل</div>${chs.map(c=>`<div class="cbar"><div class="cbh"><span>${esc(chT(c.id))}</span><span>${fmt(c.avg.toFixed(1))}/۲۰</span></div><div class="cbt"><div class="cbf" style="width:${c.avg/20*100}%"></div></div></div>`).join('')||'<div class="empty"><p>هنوز نمره‌ای ثبت نشده</p></div>'}</div>`};
};

/* === BOOT === */
document.addEventListener('click', e => { if(!e.target.closest('#sidebar,.mtg')) closeSidebar(); });
(async () => {
  try{ const t = localStorage.getItem('theme'); if(t) document.documentElement.dataset.theme = t; }catch(e){}
  try{
    ST.user = await AUTH.current();
    if(ST.user?.role==='student'){ await checkMissions(ST.user.id); await checkBadges(ST.user.id); }
    await render();
  }catch(e){ console.error(e); showError(e.message||String(e), e.stack); }
})();
</script>
